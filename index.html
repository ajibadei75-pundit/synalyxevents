<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Event</title>
<meta name="theme-color" content="#203a6e"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon-192.png"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--p:#203a6e;--a:#c9962b;--bg:#faf3da;--c:#fff;--t:#14213d;--m:#5b6475;--b:#e0d8bd;--font:'Montserrat',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1424;--c:#172036;--t:#eef1f8;--m:#9aa5bd;--b:#2a3556}}
:root[data-theme=dark]{--bg:#0e1424;--c:#172036;--t:#eef1f8;--m:#9aa5bd;--b:#2a3556}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 var(--font);background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1{font-size:28px;margin:0 0 8px}h2{font-size:22px;margin:24px 0 12px}h3{font-size:18px;margin:0 0 12px}h4{margin:16px 0 8px}
a{color:var(--p)}.muted{color:var(--m)}.big{font-size:32px;font-weight:700;margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--c);border-bottom:1px solid var(--b)}
.top nav{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.top nav a{text-decoration:none;font-weight:700}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--t);font-weight:700}.brand img{height:40px;width:auto;border-radius:4px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:24px;margin-bottom:16px}
.narrow{max-width:520px;margin:24px auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}.row>input,.row>select{flex:1;min-width:160px}
label{display:block;margin-bottom:16px;font-weight:700;font-size:14px}
input,select{display:block;width:100%;min-height:44px;margin-top:4px;padding:8px 12px;font:16px var(--font);color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px}
input[type=color]{padding:4px}input[type=range]{padding:0}input[type=file]{padding:8px}
.chk{display:flex;gap:12px;align-items:flex-start;font-weight:400}.chk input{width:24px;min-height:24px;margin:0;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 20px;font:700 16px var(--font);color:#fff;background:var(--p);border:2px solid var(--p);border-radius:8px;cursor:pointer;text-decoration:none;text-align:center}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}.btn.alt{background:transparent;color:var(--t);border-color:var(--b)}.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--b);font-size:14px}
.banner{background:var(--a);color:#14213d;padding:12px 16px;border-radius:8px;margin:16px 0;font-weight:700}
.pv,.stage canvas{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--b);background:var(--bg);margin:12px 0}
.stage{position:relative;touch-action:none;cursor:crosshair}.mark{position:absolute;width:20px;height:20px;margin:-10px;border:3px solid var(--a);border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
.chart{display:flex;gap:4px;align-items:flex-end;height:140px}.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--m)}.chart i{width:100%;background:var(--p);border-radius:4px 4px 0 0;min-height:2px}
.sk{height:80px;border-radius:8px;background:linear-gradient(90deg,var(--b),transparent,var(--b));background-size:200%;animation:s 1.2s infinite}@keyframes s{to{background-position:-200%}}
#toasts{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;z-index:9;pointer-events:none}
.toast{background:var(--t);color:var(--bg);padding:12px 20px;border-radius:8px;max-width:480px;border-left:6px solid var(--a)}.toast.err{border-color:#d33}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--b);color:var(--t)}.pill.ok{background:#1f8a4c;color:#fff}td input[type=checkbox],th input[type=checkbox]{width:20px;min-height:20px;margin:0}.btn:hover:not(:disabled){filter:brightness(1.12)}.card{box-shadow:0 1px 2px rgba(20,33,61,.06)}
[hidden]{display:none!important}
.hero{background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,var(--a)));color:#fff;border-radius:20px;padding:clamp(24px,5vw,44px);margin:24px auto;position:relative;overflow:hidden}.hero h1{font-size:clamp(26px,6vw,40px);line-height:1.15;margin:0 0 8px}.hero p{margin:4px 0;opacity:.93}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1);animation:float 9s ease-in-out infinite}@keyframes float{50%{transform:translate(-24px,24px)}}
main>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}main>*:nth-child(2){animation-delay:.08s}main>*:nth-child(3){animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.toast{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}}
.btn{transition:transform .12s,filter .15s}.btn:active:not(:disabled){transform:scale(.96)}
.grid>.card{transition:transform .2s,box-shadow .2s}.grid>.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(20,33,61,.13)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;margin-right:8px}@keyframes rot{to{transform:rotate(360deg)}}
.check{width:72px;height:72px;display:block;margin:0 0 16px}.check circle,.check path{fill:none;stroke:var(--a);stroke-linecap:round;stroke-linejoin:round}.check circle{stroke-width:3;stroke-dasharray:166;stroke-dashoffset:166;animation:dash .6s .1s forwards}.check path{stroke-width:4;stroke-dasharray:48;stroke-dashoffset:48;animation:dash .4s .6s forwards}@keyframes dash{to{stroke-dashoffset:0}}
.chart i{transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}@keyframes grow{from{transform:scaleY(0)}}
.top nav a{padding:8px 14px;border-radius:999px;transition:background .15s}.top nav a:hover{background:var(--b)}
.wrap{max-width:min(1200px,100%)}
@media(max-width:700px){.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 8px}.tabs .btn{flex:none}.top nav{width:100%;justify-content:space-between;gap:8px}.top nav a{padding:8px 10px}.hero{border-radius:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:480px){.top{padding:12px 16px}.card{padding:16px}h1{font-size:24px}}
</style>
</head>

async function render(kind,name,photo,o={}){
 const c=S[kind];if(!c.tpl)throw Error('The organiser has not uploaded this template yet');

 const txt=(t,p)=>{if(!t||!p)return;let px=p.size/1000*W;const f=()=>x.font=`700 ${px}px "${p.font||'Montserrat'}"`;f();const m=x.measureText(t).width;if(m>W*.9){px*=W*.9/m;f()}x.fillStyle=p.color||'#000';x.textAlign=p.align||'center';x.textBaseline='middle';x.fillText(t,p.x*W,p.y*H)};
 if(kind==='flier'){const p=c.photo,pw=p.w*W,ph=pw/(p.ratio||1),px=p.x*W-pw/2,py=p.y*H-ph/2;x.save();x.beginPath();p.shape==='circle'?x.ellipse(p.x*W,p.y*H,pw/2,ph/2,0,0,7):x.roundRect(px,py,pw,ph,pw*.08);x.clip();
  if(photo){const k=Math.max(pw/photo.width,ph/photo.height),sw=pw/k,sh=ph/k;x.drawImage(photo,(photo.width-sw)/2,(photo.height-sh)/2,sw,sh,px,py,pw,ph)}else{x.fillStyle='#cbd2e0';x.fillRect(px,py,pw,ph)}x.restore();
  if(c.nameOn)txt(name,c.name);if(c.textOn)txt(S.event.name,c.text)}
 else{txt(name,c.name);if(c.sig&&c.sigPos){const s=await cached(c.sig),w=c.sigPos.w*W,h=w*s.height/s.width;x.drawImage(s,c.sigPos.x*W-w/2,c.sigPos.y*H-h/2,w,h)}if(c.dateOn)txt(S.event.date,c.date);if(c.numOn)txt(o.num,c.num)}
 return cv}

const T=(o={})=>({x:.5,y:.5,size:60,font:'Montserrat',color:'#14213d',align:'center',...o});
const DEF={flier:{photo:{x:.5,y:.4,w:.4,ratio:1,shape:'circle'},name:T({y:.75,color:'#ffffff'}),text:T({y:.85,size:36,color:'#ffffff'})},certificate:{name:T({size:80}),sigPos:{x:.75,y:.8,w:.2},date:T({x:.25,y:.85,size:32}),num:T({y:.93,size:26,color:'#5b6475'})}};
const TG={flier:[['photo','Photo area'],['name','Name text'],['text','Event text']],certificate:[['name','Attendee name'],['sigPos','Signature'],['date','Date'],['num','Certificate number']]};
async function des(kind){
 const{data:row}=await sb.from('settings').select('data').eq('id',kind).maybeSingle();if(row)S[kind]=row.data;
 const c=S[kind],p=$('#pane');for(const k in DEF[kind])c[k]??={...DEF[kind][k]};
 const R=(k,l,mn,mx,sc=1)=>`<label>${l}<input type=range data-k=${k} data-sc=${sc} min=${mn} max=${mx} value="${(get(c,k)??0)*sc}"></label>`,
 SEL=(k,l,o,n)=>`<label>${l}<select data-k=${k} ${n?'data-n=1':''}>${o.map(([v,t])=>`<option value="${v}" ${String(get(c,k))===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`,
 CK=(k,l)=>`<label class=chk><input type=checkbox data-k=${k} ${c[k]?'checked':''}>${l}</label>`,
 TX=(k,l,al)=>`<h4>${l}</h4>${R(k+'.size','Size',12,200)}${SEL(k+'.font','Font',FO)}<label>Colour<input type=color data-k=${k}.color value="${get(c,k+'.color')}"></label>${al?SEL(k+'.align','Alignment',[['left','Left'],['center','Centre'],['right','Right']]):''}`;
 const ctl=kind==='flier'?`<h4>Photo area</h4>${R('photo.w','Width (% of flier)',5,90,100)}${SEL('photo.ratio','Ratio',[[1,'1:1'],[.8,'4:5'],[.75,'3:4'],[1.25,'5:4']],1)}${SEL('photo.shape','Shape',[['circle','Circle'],['rect','Rounded rectangle']])}${CK('nameOn','Show attendee name')}${TX('name','Name text')}${CK('textOn','Show event name')}${TX('text','Event text')}`
 :`${TX('name','Attendee name',1)}<h4>Signature</h4><label>Signature image (PNG)<input type=file id=sg accept="image/*"></label>${R('sigPos.w','Width (% of page)',5,60,100)}${CK('dateOn','Show event date')}${TX('date','Date text')}${CK('numOn','Show certificate number')}${TX('num','Number text')}${CK('released','Release certificates to approved attendees')}`;
 p.innerHTML=`<div class=grid style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class=card><h3>${kind==='flier'?'Flier':'Certificate'} designer</h3><label>Template image<input type=file id=tp accept="image/*"></label><label>Click or drag on the preview to place<select id=tg>${TG[kind].map(([k,l])=>`<option value=${k}>${l}</option>`).join('')}</select></label><div class=stage id=st><canvas id=cv></canvas><div class=mark id=mk></div></div></div><div class=card>${ctl}<button class=btn id=sv>Save ${kind}</button></div></div>`;
 const cv=$('#cv'),st=$('#st'),mk=$('#mk');let busy=0,dirty=0;
 const mark=()=>{const o=c[$('#tg').value];mk.style.left=o.x*100+'%';mk.style.top=o.y*100+'%'};
 const draw=async()=>{dirty=1;if(busy)return;busy=1;while(dirty){dirty=0;try{const r=await render(kind,'Ade Ibrahim',null,{num:'CERT-000001'});cv.width=r.width;cv.height=r.height;cv.getContext('2d').drawImage(r,0,0)}catch{}}busy=0;mark()};
 const mv=e=>{const r=st.getBoundingClientRect(),o=c[$('#tg').value];o.x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));o.y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));draw()};
 st.onpointerdown=e=>{st.setPointerCapture(e.pointerId);mv(e)};st.onpointermove=e=>{if(e.buttons)mv(e)};$('#tg').onchange=mark;
 p.querySelectorAll('[data-k]').forEach(i=>i.oninput=i.onchange=()=>{let v=i.type==='checkbox'?i.checked:i.type==='range'?+i.value/+i.dataset.sc:i.dataset.n?+i.value:i.value;put(c,i.dataset.k,v);draw()});
 $('#tp').onchange=async e=>{try{c.tpl=await fileData(e.target.files[0],1800);draw()}catch{toast('Could not read that image','err')}};
 if($('#sg'))$('#sg').onchange=async e=>{try{c.sig=await fileData(e.target.files[0],600,'image/png');draw()}catch{toast('Could not read that image','err')}};
 $('#sv').onclick=()=>save(kind);
 if(c.tpl)draw();else{st.insertAdjacentHTML('beforebegin','<p class=muted>Upload a template image to begin.</p>');mark()}}

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const path=location.pathname.replace(/\/+$/,'')||'/';
(async()=>{shell('<div class=sk></div>');await load();path==='/admin'?admin():path==='/portal'?portal():register()})();
</script>
</body>
</html>
